<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<title>Nhắc việc</title>
<!-- Thẻ nhắc việc nổi (mac/remind.swift mở trang này trong cửa sổ trong suốt). Tham số: t=tên việc, n=mô tả, at=giờ nhắc, xp, s=số lần đã hoãn, over=quá hạn -->
<style>
@font-face{font-family:BVP;src:url(fonts/bvp-vietnamese-700.woff2) format('woff2');font-weight:700;unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:BVP;src:url(fonts/bvp-latin-700.woff2) format('woff2');font-weight:700}
@font-face{font-family:BVP;src:url(fonts/bvp-vietnamese-500.woff2) format('woff2');font-weight:500;unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:BVP;src:url(fonts/bvp-latin-500.woff2) format('woff2');font-weight:500}
*{box-sizing:border-box;margin:0}
html,body{background:transparent;height:100%;overflow:hidden;font-family:BVP,-apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;padding:22px}
.card{position:relative;width:100%;border-radius:30px;padding:26px 24px 20px;color:#fff;overflow:hidden;
  background:linear-gradient(150deg,#6d28d9 0%,#db2777 55%,#f97316 100%);
  box-shadow:0 24px 50px -14px rgba(76,29,149,.65),inset 0 1px 0 rgba(255,255,255,.25);
  animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
.card.urgent{background:linear-gradient(150deg,#be123c 0%,#e11d48 45%,#f59e0b 100%)}
.card::before,.card::after{content:"";position:absolute;border-radius:50%;filter:blur(30px);opacity:.55;animation:float 7s ease-in-out infinite alternate;pointer-events:none}
.card::before{width:200px;height:200px;background:#22d3ee;top:-80px;right:-60px}
.card::after{width:180px;height:180px;background:#facc15;bottom:-90px;left:-50px;animation-delay:-3s}
.top{position:relative;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.2);backdrop-filter:blur(6px)}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:ping 1.4s infinite}
.x{margin-left:auto;width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:15px;cursor:pointer}
.x:hover{background:rgba(255,255,255,.32)}
.stk{position:relative;display:block;width:104px;height:104px;margin:10px auto 2px;animation:wiggle 1.1s ease-in-out .5s 3,bob 2.4s ease-in-out 3.8s infinite;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25))}
h1{position:relative;text-align:center;font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.task{position:relative;margin:16px 0 0;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.95);color:#1e1b4b;
  box-shadow:0 8px 20px -10px rgba(0,0,0,.35);transform:rotate(-1.2deg);animation:slide .5s .25s cubic-bezier(.2,1.4,.4,1) both}
.task b{display:block;font-size:17px;line-height:1.35;font-weight:700;word-break:break-word}
.task p{margin-top:4px;font-size:13px;line-height:1.4;color:#6b7280;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.meta span{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:#f3e8ff;color:#7e22ce}
.meta span.xp{background:#fef3c7;color:#b45309}
.meta span.late{background:#ffe4e6;color:#be123c}
.acts{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
button{font:inherit;cursor:pointer}
.go{grid-column:1/-1;height:54px;border:0;border-radius:16px;background:#fff;color:#7c3aed;font-size:17px;font-weight:700;
  box-shadow:0 6px 0 #c4b5fd,0 12px 24px -8px rgba(0,0,0,.4);transition:transform .1s,box-shadow .1s;animation:glow 2s ease-in-out infinite}
.urgent .go{color:#e11d48;box-shadow:0 6px 0 #fda4af,0 12px 24px -8px rgba(0,0,0,.4)}
.go:hover{transform:translateY(-2px) scale(1.01)} .go:active{transform:translateY(5px);box-shadow:0 1px 0 #c4b5fd}
.sub{height:44px;border:1.5px solid rgba(255,255,255,.45);border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:14px;font-weight:700;transition:background .15s,transform .1s}
.sub:hover{background:rgba(255,255,255,.24)} .sub:active{transform:scale(.97)}
kbd{font:600 10px BVP,system-ui;opacity:.6;margin-left:4px;padding:1px 5px;border:1px solid currentColor;border-radius:5px}
.foot{position:relative;margin-top:12px;text-align:center;font-size:11.5px;opacity:.8;font-weight:500}
.done-layer{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(150deg,#059669,#10b981 50%,#84cc16);border-radius:30px;z-index:5;text-align:center;padding:20px}
.done-layer.on{display:flex;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.done-layer img{width:130px;height:130px}
.done-layer b{font-size:26px} .done-layer span{font-size:15px;font-weight:500;opacity:.95}
.cf{position:fixed;width:9px;height:14px;top:-20px;z-index:9;border-radius:2px;pointer-events:none;animation:fall linear forwards}
.bye{animation:bye .32s ease-in forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6) translateY(40px) rotate(-4deg)}100%{opacity:1;transform:none}}
@keyframes bye{to{opacity:0;transform:scale(.85) translateY(30px)}}
@keyframes slide{0%{opacity:0;transform:translateY(20px) rotate(4deg)}100%{opacity:1;transform:rotate(-1.2deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}15%{transform:rotate(-16deg) scale(1.08)}30%{transform:rotate(14deg)}45%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes float{to{transform:translate(-30px,40px) scale(1.2)}}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
@keyframes glow{50%{filter:brightness(1.06)}}
@keyframes fall{to{transform:translate(var(--dx),620px) rotate(var(--r));opacity:.9}}
</style></head>
<body>
<div class="card" id="card">
  <div class="top"><span class="pill live" id="at"></span><span class="pill" id="tag">Nhắc việc</span><button class="x" title="Để sau (Esc)" onclick="send('later')">✕</button></div>
  <img class="stk" id="stk" alt="">
  <h1 id="hd"></h1>
  <div class="task"><b id="tt"></b><p id="tn" hidden></p><div class="meta" id="meta"></div></div>
  <div class="acts">
    <button class="go" id="go" onclick="done()"></button>
    <button class="sub" onclick="send('snooze')">⏳ Cho 15p nữa<kbd>S</kbd></button>
    <button class="sub" onclick="send('later')">🙈 Để sau<kbd>Esc</kbd></button>
  </div>
  <div class="foot" id="ft"></div>
  <div class="done-layer" id="dl"><img src="stickers/1f973.webp" alt=""><b>Slay quá trời! 💅</b><span id="dlx"></span></div>
</div>
<script>
const P = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const xp = +P.get('xp') || 10, snz = +P.get('s') || 0, over = P.get('over') === '1';
const HEAD = [
  'Ê, tới giờ rồi nè 👀', 'Bestie ơi, việc này đang đợi á', 'Đừng để deadline "seen" không rep nha',
  'Ting ting! Làm phát ăn ngay 🔥', 'Main character thì làm luôn chứ', 'Khum trì hoãn nữa nha 🫵',
];
const HEAD_SNZ = ['Hoãn ' + snz + ' lần rồi đó nha 😤', 'Lần này làm thiệt nha, hứa rồi đó 🥺', 'Việc này bắt đầu dỗi rồi á 😭'];
const HEAD_OVER = ['Việc này trễ hẹn rồi á 🚨', 'Quá hạn rồi bestie ơi, cứu với 🚨'];
const GO = ['Xong luôn 💪', 'Làm liền nè 🚀', 'Chốt đơn, xong! ✅', 'Ok để em xử ⚡'];
const FOOT = ['Xong việc là lên level đó nha ✨', 'Mỗi việc xong là +XP, chuỗi lửa đang chờ 🔥', 'Một việc nhỏ hôm nay, một bước to ngày mai 🌱'];
$('at').textContent = '⏰ ' + (P.get('at') || 'Bây giờ');
$('tag').textContent = over ? 'Quá hạn' : snz ? 'Lần ' + (snz + 1) : 'Nhắc việc';
$('hd').textContent = over ? pick(HEAD_OVER) : snz ? pick(HEAD_SNZ) : pick(HEAD);
$('tt').textContent = P.get('t') || 'Việc cần làm';
if (P.get('n')) { $('tn').hidden = false; $('tn').textContent = P.get('n'); }
$('meta').innerHTML = `<span class="xp">+${xp} XP</span>` + (over ? '<span class="late">Trễ hẹn</span>' : '') + (snz ? `<span>Đã hoãn ${snz}×</span>` : '');
$('go').innerHTML = pick(GO) + '<kbd>↵</kbd>';
$('ft').textContent = pick(FOOT);
$('stk').src = 'stickers/' + (over || snz >= 2 ? pick(['1f6a8', '1f97a']) : pick(['23f0', '1f440', '23f0'])) + '.webp';
if (over || snz >= 2) $('card').classList.add('urgent');

let sent = false;
function send(a, wait = 0) {
  if (sent) return; sent = true;
  setTimeout(() => { $('card').classList.add('bye'); setTimeout(() => { try { webkit.messageHandlers.hpb.postMessage(a); } catch { window.close(); } }, 300); }, wait);
}
function done() {
  if (sent) return;
  $('dlx').textContent = `+${xp} XP vào túi rồi nha ✨`; $('dl').classList.add('on');
  const C = ['#facc15', '#22d3ee', '#f472b6', '#a78bfa', '#4ade80', '#fb923c', '#fff'];
  for (let i = 0; i < 70; i++) { const c = document.createElement('i'); c.className = 'cf';
    c.style.cssText = `left:${Math.random() * 100}%;background:${pick(C)};animation-duration:${1 + Math.random() * 1.2}s;animation-delay:${Math.random() * .3}s;--dx:${(Math.random() - .5) * 160}px;--r:${(Math.random() - .5) * 900}deg`;
    document.body.appendChild(c); }
  send('done', 1500);
}
addEventListener('keydown', e => { if (e.key === 'Enter') done(); else if (e.key === 'Escape') send('later'); else if (e.key.toLowerCase() === 's') send('snooze'); });
</script>
</body></html>
