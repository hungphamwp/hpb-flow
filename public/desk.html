// thay cho các hàm của app.js mà pet.js dùng tới
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error?.message || d.error || r.statusText); return d;
}
function nav(h) { try { window.webkit.messageHandlers.bong.postMessage({ cmd: 'open', hash: h }); } catch { location.hash = h; } }
</script>
